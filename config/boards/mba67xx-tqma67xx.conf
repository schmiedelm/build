# TI AM67A/J722S quad Cortex-A53 SoC, 2/8GB RAM, 2x GBE, USB, CAN, SPE

BOARD_NAME="MBa67xx"
BOARD_VENDOR="tqgroup"
BOARDFAMILY="k3"
BOARD_MAINTAINER="schmiedelm"
INTRODUCED="2026"
HAS_VIDEO_OUTPUT="yes"
BOOT_SOC="j722s"
BOOTCONFIG="tqma67xx_mba67xx_a53_defconfig"
BOOTFS_TYPE="fat"
# TQ's u-boot env uses bootstd (extlinux.conf), not the family's default boot.scr/uEnv.txt.
SRC_EXTLINUX="yes"
TIBOOT3_BOOTCONFIG="tqma67xx_mba67xx_r5_defconfig"
TIBOOT3_FILE="tiboot3-j722s-hs-fs-tqma67xx.bin"
KERNEL_TARGET="vendor,edge"
KERNEL_TEST_TARGET="vendor,edge"
DEFAULT_CONSOLE="serial"
SERIALCON="ttyS0"
# SRC_EXTLINUX boards don't get SERIALCON auto-added to the cmdline; without console= the kernel
# boots silently (confirmed on mba62xx hardware). No earlycon yet - UART address unconfirmed here.
SRC_CMDLINE="console=ttyS0,115200"
ATF_PLAT="k3"
ATF_BOARD="lite"
OPTEE_ARGS="CFG_TEE_CORE_LOG_LEVEL=1"
OPTEE_PLATFORM="k3-am62x"
BOOT_FDT_FILE="ti/k3-am67a-tqma67xx-mba67xx.dtb"
# DisplayPort/DSI and LVDS/SPE/CSI overlays aren't wired up on "edge" (mainline) yet - needs
# J722S/AM62P DSS1+DSI-TX SoC support mainline doesn't have (TI's own "drm/tidss: Add BeagleY-AI
# display support" series, unmerged as of 2026-08-31). "vendor" already has all of this natively.

# TQ's own u-boot fork has the tqma67xx defconfigs ready-made; applies regardless of BRANCH.
function post_family_config__mba67xx_uboot_vendor() {
	declare -g BOOTSOURCE="https://github.com/tq-systems/u-boot-tqmaxx"
	declare -g BOOTBRANCH="commit:5c778312688bd46835a93b811c51f1510e0b3cb9" # TQMaxx-u-boot-v2026.01
	# Not "u-boot-k3" (shared with other k3 boards) or "u-boot-tqma" (imx8m/imx93, same repo, different branch).
	declare -g BOOTPATCHDIR="u-boot-tq-k3"
	# TIBOOT3_FILE/TIBOOT3_BOOTCONFIG aren't in artifact-uboot.sh's hash; fold in for reliable cache-busting.
	declare -g UBOOT_HASH_EXTRA="TQMaxx-u-boot-v2026.01-${TIBOOT3_FILE}"
}

# TQ's own kernel already has full native support, incl. DP/DSI which mainline still lacks.
# Only BRANCH=vendor (not vendor-rt/vendor-edge, unverified).
function post_family_config_branch_vendor__mba67xx_use_tq_vendor_kernel() {
	declare -g KERNELSOURCE="https://github.com/tq-systems/linux-tqmaxx"
	declare -g KERNELBRANCH="commit:d1f6c258293a1c6cf568c78e4ce0207a002823f8" # TQMaxx-ti-linux-6.18.y
	declare -g KERNEL_DESCRIPTION="TQ-Systems TQMaxx vendor kernel (TI Processor SDK based)"
	# Not the shared archive/k3-6.18 (other maintainers' patches) - TQ's tree needs none of it.
	declare -g KERNELPATCHDIR="tq-k3-vendor"
	# Not the shared linux-k3-vendor.config (TI's generic vendor kernel, used by e.g. sk-am62-lp).
	declare -g LINUXCONFIG="linux-k3-tq-vendor"
}

# CONFIG_SPL is unset in this a53 defconfig - no separate A53-SPL/tispl.bin stage, ATF+OP-TEE+DM+DTB
# are bundled straight into u-boot.img instead. Override the family defaults accordingly.
function post_family_config__mba67xx_no_tispl_stage() {
	declare -g UBOOT_TARGET_MAP="BL31=bl31.bin ${EXTRA_BOOT_ARGS} TEE=${SRC}/cache/sources/optee-os/out/arm-plat-k3/core/tee-pager_v2.bin BINMAN_INDIRS=${SRC}/cache/sources/ti-linux-firmware all;;tiboot3.bin ${UBOOT_FILE:-u-boot.img}:u-boot.img"

	function write_uboot_platform() {
		cp "$1/tiboot3.bin" "${MOUNT}/boot"
		cp "$1/u-boot.img" "${MOUNT}/boot"
	}
}

function post_config_uboot_target__mba67xx_legacy_image_format() {
	run_host_command_logged scripts/config --enable CONFIG_LEGACY_IMAGE_FORMAT
}
