# NXP i.MX8M Plus quad Cortex-A53 SoC, 1/2/4/8GB RAM, 2x GBE, USB3, CAN, HDMI, MIPI-DSI, PCIe, LVDS
BOARD_NAME="TQ-SMARC2-TQMa8MPxS"
BOARD_VENDOR="tqgroup"
BOARDFAMILY="imx8m"
BOARD_MAINTAINER="schmiedelm"
INTRODUCED="2025"
HAS_VIDEO_OUTPUT="yes"
ATF_PLAT="imx8mp"
ATF_UART_BASE="0x30880000"
BOOTCONFIG="tqma8mpxs_multi_mb_smarc_2_defconfig"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current,edge"
DEFAULT_CONSOLE="serial"
SERIALCON="ttymxc2"
BOOT_FDT_FILE="freescale/imx8mp-tqma8mpqs-mb-smarc-2.dtb"
ASOUND_STATE="asound.state.tqma"
OVERLAY_PREFIX="imx8mp-tqma8mpqs-mb-smarc-2"
# Bring-up/test tools
PACKAGE_LIST_BOARD+=" can-utils i2c-tools pciutils evtest mesa-utils gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad"
# Hantro G1/G2 are stateless VPUs: distro ffmpeg (v4l2m2m) cannot drive them. This extension
# installs Kwiboo's ffmpeg (V4L2 request hwaccel) and replaces the distro ffmpeg.
ENABLE_EXTENSIONS="ffmpeg-v4l2-request"
